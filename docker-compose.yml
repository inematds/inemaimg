services:
  inemaimg:
    build: .
    image: inemaimg:latest
    container_name: inemaimg
    # Sem religar sozinho: quem liga e desliga é o porteiro (wifi/inemaimg-porteiro),
    # que fica na porta 8000 e desliga após 10 min sem pedido (11/11/2026).
    restart: "no"

    # GB10 (DGX Spark) — nvidia runtime via NVIDIA Container Toolkit / CDI
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_ENABLE_HF_TRANSFER=1
      # HuggingFace token for gated repos (FLUX.2-klein / FLUX.2-dev).
      # Set HF_TOKEN in your shell or a .env file next to this compose file;
      # if unset, only public models will load.
      - HF_TOKEN=${HF_TOKEN:-}
      # The model pre-warmed on container start. Empty = no prewarm.
      - INEMAIMG_PREWARM=flux2-klein
      # Text-encoder quantization for flux2-klein: int4 | int8 | none.
      # Cuts the Qwen3-8B text encoder down from ~16 GB. Falls back automatically.
      - INEMAIMG_TE_QUANT=int8
      # Descarrega o modelo da GPU após N min sem uso (0 = nunca). O próximo /generate recarrega.
      - INEMAIMG_IDLE_UNLOAD_MIN=30

    volumes:
      # Persist HuggingFace cache so we don't re-download ~40GB every rebuild.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Optional: outputs directory for debug dumps
      - ./outputs:/app/outputs
      # Live-mount the playground UI so tweaks land without a rebuild.
      # The server reads web/index.html via FileResponse on each request.
      - ./web:/app/web:ro

    # Porta interna. A 8000 (LAN) agora é do porteiro, que liga este contêiner
    # no primeiro pedido e repassa. Sem auth no /generate (vale o aviso antigo).
    ports:
      - "127.0.0.1:8001:8000"

    # Pipelines use large shared-memory tensors for dataloader workers.
    shm_size: "8g"

    # Hard memory cap. GB10 unified memory means torch alloc consumes host RAM —
    # without this, a runaway model load thrashes the box (crashes 2026-05-05 and
    # 2026-05-07). Watchdog (wifi/inemaimg-watchdog.sh) alerts at 20G; OOM-kill at 30G.
    mem_limit: "30g"
    memswap_limit: "30g"

    # Healthcheck hits /health — fast, doesn't load the model.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # /health responds instantly now that prewarm is async
